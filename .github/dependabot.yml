# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 20
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Major bumps are NOT grouped: each lands in its own PR for individual
    # review, per the risk policy in /dependabot-review
    # (docs/superpowers/specs/2026-08-24-dependabot-workflow-design.md).

  - package-ecosystem: "npm"
    directory: "/comments-worker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
