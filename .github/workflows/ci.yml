name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Check for build and type issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

        # use astro check for issues
      - name: Run Astro check
        run: npm run check

        # ensure build works
      - name: Run Astro build
        run: npm run build

  worker-check:
    name: Check comments-worker build and types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes under comments-worker/
        id: changed
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha || 'HEAD^' }} HEAD | grep -q '^comments-worker/'; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup node
        if: steps.changed.outputs.any == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: comments-worker/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.any == 'true'
        working-directory: comments-worker
        run: npm ci

      - name: Type check
        if: steps.changed.outputs.any == 'true'
        working-directory: comments-worker
        run: npx tsc --noEmit
